[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kolektorsdd-classification"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "albumentations>=1.3",
    "omegaconf>=2.3",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tensorboard>=2.13",
    "tqdm>=4.65",
    "Pillow>=10.0",
    "opencv-python-headless>=4.8",
    "grad-cam>=1.4",
    "ruff>=0.1",
    "jupyter>=1.0",
    "nbconvert>=7.7",
    "nbstripout>=0.6",
    "ipykernel>=6.25",
]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]
