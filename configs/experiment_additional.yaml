stage: 6
experiment_name: additional  # 노트북에서 실험명 오버라이드

model:
  architecture: efficientnet_b0
  num_classes: 1
  dropout_rate: 0.2
  pretrained: true
  pretrained_source: imagenet
  freeze_backbone: true

training:
  checkpoint_dir: experiments/additional/checkpoints
  log_dir: experiments/additional/logs
  epochs: 30
  lr: 0.001          # Phase 1: classifier only
  phase2_lr: 0.0001  # Phase 2: full fine-tuning
  frozen_epochs: 5
  weight_decay: 0.0001
  early_stopping_patience: 10
  batch_size: 32

augmentation:
  train:
    letterbox: true
    clahe_p: 0.5
    clahe_clip_limit: 2.0
    elastic_p: 0        # ElasticTransform 실험 시 0.15로 오버라이드
    rotate_limit: 0
    rotate_p: 0.3
    brightness_contrast_p: 0.4
    horizontal_flip_p: 0.5
    vertical_flip_p: 0  # VerticalFlip 실험 시 0.5로 오버라이드
    normalize_mean: [0.485, 0.456, 0.406]
    normalize_std: [0.229, 0.224, 0.225]
  val:
    normalize_mean: [0.485, 0.456, 0.406]
    normalize_std: [0.229, 0.224, 0.225]

loss:
  type: bce_with_logits
  pos_weight: null

evaluation:
  tta:
    enabled: false
    n_aug: 5

output:
  checkpoint_dir: experiments/additional/checkpoints
  log_dir: experiments/additional/logs
