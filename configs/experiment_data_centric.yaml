training:
  checkpoint_dir: experiments/data_centric/checkpoints
  log_dir: experiments/data_centric/logs

augmentation:
  train:
    letterbox: false
    clahe_p: 0.5
    clahe_clip_limit: 2.0
    horizontal_flip_p: 0.5
    brightness_contrast_p: 0.4

loss:
  type: bce_with_logits
  pos_weight: null  # state.yaml train split 기준 자동 계산 (244/36 ≈ 6.78)

data:
  use_weighted_sampler: false
